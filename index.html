<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11.1 电流的两条公式 · 可交互课件</title>
<style>
  :root{
    /* A · Manim 基调：纯黑底 + 白线为主 + Manim 官方色常量
       黄 = 结论量（I、Q、柱体） 蓝 = 负电荷（自由电子） 红 = 正电荷
       一屏同屏彩色元素 ≤ 3 种；不使用渐变/霓虹/投影 */
    --bg:#000000; --bg2:#0a0a0a; --panel:#0e0e0e; --line:#242424; --line2:#383838;
    --ink:#FFFFFF; --ink2:#B0B0B0; --muted:#888888;
    --pos:#FC6255; --neg:#58C4DD;
    --yellow:#FFFF00; --gold:#F0AC5F; --green:#83C167; --purple:#9A72AC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","WenQuanYi Zen Hei",sans-serif; overflow:hidden;}
  .app{display:grid; grid-template-rows:auto auto 1fr auto auto; height:100vh;}

  header{display:flex; align-items:baseline; gap:14px; padding:10px 18px 8px; flex-wrap:wrap; row-gap:3px;
    background:var(--bg2); border-bottom:1px solid var(--line);}
  header h1{font-size:16px; margin:0; font-weight:600; letter-spacing:.5px; white-space:nowrap;}
  .act{font-size:13px; color:var(--yellow); border:1px solid var(--line2); border-radius:10px; padding:1px 9px; white-space:nowrap;}
  .steptitle{font-size:15px; color:var(--ink); font-weight:600;}
  .stepsn{margin-left:auto; font-size:13px; color:var(--ink2); font-variant-numeric:tabular-nums;}

  .topnav{display:flex; align-items:center; gap:5px; padding:5px 14px 6px;
    background:var(--bg2); border-bottom:1px solid var(--line); overflow-x:auto; overflow-y:hidden;}
  .topnav .grouplab{flex:0 0 auto; font-size:11px; letter-spacing:.6px; color:var(--muted); font-weight:600; white-space:nowrap;}
  .topnav .sep{flex:0 0 auto; width:1px; height:15px; background:var(--line2); margin:0 5px;}
  .topnav a{flex:0 0 auto; min-width:27px; height:22px; padding:0 7px; display:inline-flex; align-items:center; justify-content:center;
    font-size:12px; font-variant-numeric:tabular-nums; color:var(--ink2); background:#141414;
    border:1px solid var(--line2); border-radius:6px; cursor:pointer;}
  .topnav a:hover{background:#1e1e1e; color:var(--ink);}
  .topnav a.on{background:rgba(255,255,0,0.12); border-color:var(--yellow); color:var(--yellow); font-weight:700;}

  .stage{display:grid; grid-template-columns:1fr 288px; min-height:0;}
  .canvaswrap{position:relative; min-width:0; min-height:0; padding:6px 8px 0 8px;}
  canvas{display:block; width:100%; height:100%;}
  .hint{padding:7px 20px 0 20px; font-size:12.5px; color:var(--muted); min-height:34px;}
  .hint b{color:var(--yellow); font-weight:600;}

  aside{background:var(--panel); border-left:1px solid var(--line); padding:10px 12px 14px; overflow-y:auto; min-height:0;}
  aside h3{font-size:12px; color:var(--muted); margin:14px 0 6px; font-weight:600; letter-spacing:.5px;}
  aside h3:first-child{margin-top:2px;}
  .rd{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:3px 0;
    font-size:12.5px; color:var(--ink2); border-bottom:1px dashed #242424;}
  .rd span{white-space:nowrap;}
  .rd b{font-size:15px; color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .rd b.yellow{color:var(--yellow);}
  .rd b.blue{color:var(--neg);}
  .rd b.red{color:var(--pos);}
  .rd b.grey{color:var(--muted);}
  .formula{font-size:13.5px; color:var(--ink); background:#141414; border:1px solid var(--line2);
    border-radius:8px; padding:8px 10px; line-height:1.6; word-break:break-word;}
  .note{font-size:12.5px; color:var(--ink2); line-height:1.62;}
  .note b{color:var(--yellow); font-weight:600;}
  .grp{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .grp .lab{font-size:12.5px; color:var(--muted);}
  button{font-family:inherit; font-size:12.5px; color:var(--ink2); background:#141414;
    border:1px solid var(--line2); border-radius:6px; padding:5px 10px; cursor:pointer; white-space:nowrap;}
  button:hover{background:#1e1e1e; color:var(--ink);}
  button.on{background:rgba(255,255,0,0.12); border-color:var(--yellow); color:var(--yellow); font-weight:700;}
  button.main{background:#1a1a1a; color:var(--ink);}

  footer{display:flex; align-items:center; gap:8px; flex-wrap:wrap; row-gap:6px;
    padding:8px 14px 9px; background:var(--bg2); border-top:1px solid var(--line);}
  .bar{position:relative; flex:1 1 140px; min-width:100px; height:6px; background:#141414; border-radius:3px; cursor:pointer;}
  .bar i{display:block; height:100%; width:0; background:var(--yellow); border-radius:3px;}
  .bar u{position:absolute; top:-2px; width:1px; height:10px; background:#4a4a4a;}
  .slider{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted);}
  .slider input[type=range]{width:104px; accent-color:#4a4a4a;}
  .slider b{color:var(--ink); font-variant-numeric:tabular-nums; min-width:44px; text-align:right;}
  .hidden{display:none !important;}

  @media (max-width: 860px){
    .stage{grid-template-columns:1fr; grid-template-rows:1fr auto;}
    aside{border-left:none; border-top:1px solid var(--line); max-height:24vh;}
    .hint{font-size:12px;}
    header h1{font-size:14px;} .steptitle{font-size:13px;}
    .slider input[type=range]{width:78px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>11.1 电流的两条公式</h1>
    <span class="act" id="actTag">第一幕</span>
    <span class="steptitle" id="stepTitle">—</span>
    <span class="stepsn" id="stepSn">1 / 15</span>
  </header>

  <nav class="topnav" id="toc" aria-label="步骤导航"></nav>

  <div class="stage">
    <div class="canvaswrap"><canvas id="cv"></canvas></div>
    <aside>
      <h3>读数</h3>
      <div class="rd"><span>已过截面的电荷（数出来的）</span><b class="yellow" id="rdCnt">—</b></div>
      <div class="rd"><span>Q（过截面的电荷量）</span><b class="yellow" id="rdQ">—</b></div>
      <div class="rd"><span>t（所用的时间）</span><b id="rdT">—</b></div>
      <div class="rd"><span>I = Q / t（定义式）</span><b class="yellow" id="rdIdef">—</b></div>
      <div class="rd"><span>I = n q S v（微观式）</span><b class="blue" id="rdImic">—</b></div>
      <div class="rd"><span>两式相对差</span><b class="grey" id="rdDiff">—</b></div>
      <h3>微观四量</h3>
      <div class="rd"><span>n 数密度</span><b id="rdN">—</b></div>
      <div class="rd"><span>q 单个电荷量</span><b id="rdQq">—</b></div>
      <div class="rd"><span>S 横截面积</span><b id="rdS">—</b></div>
      <div class="rd"><span>v 定向移动速率</span><b id="rdV">—</b></div>
      <h3>这一刻的公式</h3>
      <div class="formula" id="rdFormula">—</div>
      <h3>视角</h3>
      <div class="grp" id="wrapView">
        <button data-view="solid">立体</button>
        <button data-view="flat">剖面</button>
        <button data-view="reset">↺ 复位</button>
      </div>
      <div class="note" style="margin-top:6px">在画布上<b style="color:#F0AC5F">拖动</b>可旋转视角，滚轮缩放，双击复位。</div>
      <h3>提示</h3>
      <div class="note" id="rdNote"></div>
    </aside>
  </div>

  <div class="hint" id="hint"></div>

  <footer>
    <button id="btnPrev">◀ 上一步</button>
    <button id="btnNext" class="main">下一步 ▶</button>
    <button id="btnPlay">▶ 播放</button>
    <button id="btnReset">↺ 复位本步</button>
    <div class="bar" id="prog"><i></i></div>

    <div class="slider" id="wrapT"><span>时间 t</span><input type="range" id="rgT" min="0" max="1" step="0.01" value="0"><b id="lbT">0.00 s</b></div>
    <div class="slider" id="wrapT2"><span>时间窗口 T</span><input type="range" id="rgT2" min="0.5" max="2" step="0.1" value="1"><b id="lbT2">1.0 s</b></div>
    <div class="slider" id="wrapI"><span>电流 I</span><input type="range" id="rgI" min="0.2" max="2" step="0.05" value="1"><b id="lbI">1.00 A</b></div>
    <div class="slider" id="wrapV"><span>速率 v</span><input type="range" id="rgV" min="0" max="100" value="50"><b id="lbV">—</b></div>
    <div class="slider" id="wrapN"><span>数密度 n</span><input type="range" id="rgN" min="0" max="100" value="50"><b id="lbN">—</b></div>
    <div class="slider" id="wrapS"><span>截面 S</span><input type="range" id="rgS" min="0.2" max="2" step="0.02" value="1"><b id="lbS">1.00 mm²</b></div>

    <div class="grp" id="wrapReveal"><span class="lab">浮现 / 隐藏</span>
      <button data-rev="dots">自由电荷</button>
      <button data-rev="barrel">那段柱体</button>
      <button data-rev="density">电荷密度 n</button>
    </div>
    <div class="grp" id="wrapCarrier"><span class="lab">载流子</span>
      <button data-carrier="neg">自由电子（负）</button>
      <button data-carrier="pos">正电荷</button>
    </div>
    <div class="grp" id="wrapMat"><span class="lab">材料</span>
      <button data-mat="cu">铜</button><button data-mat="ag">银</button><button data-mat="al">铝</button>
    </div>
    <div class="grp" id="wrapPick">
      <button data-pick="def">看定义式的 Q</button>
      <button data-pick="mic">看微观式的 q</button>
    </div>
  </footer>
</div>

<script>


window.VizPhys = (function () {
'use strict';

var QE = 1.602176634e-19;
var NA = 6.02214076e23;

var MAT = {
cu: { key: 'cu', name: '铜', rho: 8.96e3,  M: 63.55,  z: 1 },
ag: { key: 'ag', name: '银', rho: 10.49e3, M: 107.87, z: 1 },
al: { key: 'al', name: '铝', rho: 2.70e3,  M: 26.98,  z: 1 }
};

function Idef(Q, t) { return t > 0 ? Q / t : NaN; }
function Qof(I, t) { return I * t; }

function Imic(n, q, S, v) { return n * q * S * v; }
function driftSpeed(I, n, q, S) { return I / (n * q * S); }

function barrelLen(v, t) { return v * t; }
function barrelVol(S, v, t) { return S * v * t; }
function barrelCount(n, S, v, t) { return n * S * v * t; }
function barrelCharge(n, q, S, v, t) { return n * q * S * v * t; }

function slabCharge(n, q, S, d) { return n * q * S * d; }
function slabCross(v, t, d) { return Math.floor(v * t / d + 1e-9); }
function slabQ(n, q, S, v, t, d) { return slabCross(v, t, d) * slabCharge(n, q, S, d); }

var NS = 80;
var K0 = 3;
var S0 = 1e-7;
function dotsPerLayer(n, S) {
var k = Math.round(K0 * (n / numberDensity('cu')) * (S / S0));
return k < 1 ? 1 : (k > 6 ? 6 : k);
}
function layerX(i, L) { return -L / 2 + (i + 0.5) * (L / NS); }
function layerPitch(L) { return L / NS; }

function inGroup(i, L, xs, v, T) {
var x0 = layerX(i, L);
return (x0 > xs - v * T) && (x0 <= xs);
}

function groupLayers(L, xs, v, T) {
var c = 0, i;
for (i = 0; i < NS; i++) { if (inGroup(i, L, xs, v, T)) { c++; } }
return c;
}

function groupDots(L, xs, v, T, n, S) { return groupLayers(L, xs, v, T) * dotsPerLayer(n, S); }

function groupLayersC(L, v, T) { return v * T / (L / NS); }

function layersPassed(L, xs, v, T) {
var c = 0, i;
for (i = 0; i < NS; i++) { if (layerX(i, L) + v * T > xs) { c++; } }
return c;
}

function crossedLayers(L, xs, v, T) { return layersPassed(L, xs, v, T) - layersPassed(L, xs, v, 0); }

function crossedDots(L, xs, v, T, n, S) { return crossedLayers(L, xs, v, T) * dotsPerLayer(n, S); }

function gateLayer(L, xs, v, T) { return NS - layersPassed(L, xs, v, T); }

function travelTime(L, v) { return v > 0 ? L / v : Infinity; }
function numberDensity(key) {
var m = MAT[key] || MAT.cu;
return m.z * m.rho * NA / (m.M * 1e-3);
}
function uA(x) { return x * 1e-6; }
function mA(x) { return x * 1e-3; }
function mm2(x) { return x * 1e-6; }
function hour(s) { return s / 3600; }

var SUP = { '-': '⁻', '+': '', '0': '⁰', '1': '¹', '2': '²', '3': '³',
'4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
function sup(k) {
var s = String(k), o = '', i;
for (i = 0; i < s.length; i++) { o += (SUP[s.charAt(i)] !== undefined ? SUP[s.charAt(i)] : s.charAt(i)); }
return o;
}
function trimZeros(s) {
if (s.indexOf('.') < 0) { return s; }
var i = s.length;
while (i > 0 && s.charAt(i - 1) === '0') { i--; }
if (i > 0 && s.charAt(i - 1) === '.') { i--; }
return s.slice(0, i);
}

function sci(x, dg) {
if (x === undefined || x === null || !isFinite(x)) { return '—'; }
if (x === 0) { return '0'; }
var s = x < 0 ? '−' : '', a = Math.abs(x);
var e = Math.floor(Math.log10(a) + 1e-12);
var m = a / Math.pow(10, e);
if (m >= 10 - 1e-9) { m = m / 10; e = e + 1; }
if (e >= -2 && e <= 4) { return s + trimZeros(a.toFixed(Math.max(0, dg - e))); }
return s + m.toFixed(dg) + '×10' + sup(e);
}

function fx(x, dg, unit) {
if (x === undefined || x === null || !isFinite(x)) { return '—'; }
var s = (x < 0 ? '−' : '') + Math.abs(x).toFixed(dg);
return unit ? (s + ' ' + unit) : s;
}
function pct(x, dg) { return fx(x * 100, dg === undefined ? 3 : dg, '%'); }

function dur(s) {
if (!isFinite(s) || s <= 0) { return '—'; }
if (s < 1e-6) { return sci(s * 1e9, 2) + ' ns'; }
if (s < 1e-3) { return sci(s * 1e6, 2) + ' µs'; }
if (s < 1)    { return sci(s * 1e3, 2) + ' ms'; }
if (s < 90)   { return fx(s, 1, 's'); }
if (s < 5400) { return fx(s / 60, 1, 'min'); }
if (s < 3 * 86400) { return fx(s / 3600, 2, 'h'); }
return fx(s / 86400, 1, '天');
}

function len(m) {
var a = Math.abs(m);
if (a === 0) { return '0'; }
if (a < 1e-6) { return sci(m * 1e9, 2) + ' nm'; }
if (a < 1e-3) { return fx(m * 1e6, 2, 'µm'); }
if (a < 1)    { return fx(m * 1e3, 3, 'mm'); }
return fx(m, 3, 'm');
}

function waveI(t) {
return 1.00 + 0.55 * Math.sin(2 * Math.PI * t / 4.0) + 0.25 * Math.sin(2 * Math.PI * t / 1.6 + 1.0);
}

function waveQ(t, N) {
var n = N || 600, i, s, h;
if (!(t > 0)) { return 0; }
h = t / n;
s = waveI(0) + waveI(t);
for (i = 1; i < n; i++) { s += waveI(i * h) * (i % 2 ? 4 : 2); }
return s * h / 3;
}

function waveAvg(t, N) { return t > 0 ? waveQ(t, N) / t : NaN; }

var WIRE_L = 8e-3;
var WIRE_R = 3.4e-4;
function radiusOf(S) { return Math.sqrt(S / Math.PI); }

function runSelfTest() {
var cases = 0, maxErr = 0, bad = [];
function rel(a, b) { var d = Math.abs(a - b), m = Math.max(Math.abs(a), Math.abs(b)); return m > 0 ? d / m : d; }
function chk(cond, tag) { cases++; if (!cond) { bad.push(tag); } }
function chkRel(a, b, tol, tag) { cases++; var e = rel(a, b); if (e > maxErr) { maxErr = e; } if (!(e <= tol)) { bad.push(tag + ' rel=' + e.toExponential(2)); } }
function chkEq(a, b, tol, tag) { cases++; var e = Math.abs(a - b); if (e > maxErr) { maxErr = e; } if (!(e <= tol)) { bad.push(tag + ' err=' + e.toExponential(2)); } }

chkRel(numberDensity('cu'), 8.49e28, 0.02, '①n(Cu)');
chkRel(numberDensity('ag'), 5.86e28, 0.02, '①n(Ag)');
chkRel(numberDensity('al'), 6.03e28, 0.02, '①n(Al)');
chk(numberDensity('cu') > 1e28, '①n 量级 10²⁸');

var Is = [1e-6, 0.05, 1, 2, 100], ts = [1e-9, 1e-3, 1, 60, 86400], i, j;
for (i = 0; i < Is.length; i++) {
for (j = 0; j < ts.length; j++) {
chkRel(Idef(Qof(Is[i], ts[j]), ts[j]), Is[i], 1e-12, '②I = (It)/t');
}
}

var ns = [1e26, 8.49e28, 5.86e28], vs = [1e-6, 7.35e-5, 1e-3, 2], Ss = [1e-7, 1e-6, 1e-4];
for (i = 0; i < ns.length; i++) {
for (j = 0; j < vs.length; j++) {
var S = Ss[j % Ss.length], n = ns[i], v = vs[j];
var I0 = Imic(n, QE, S, v);
var tt = 1e-3;
chkRel(barrelCharge(n, QE, S, v, tt) / tt, I0, 1e-9, '③柱体法 = 微观式');
chkRel(Idef(barrelCharge(n, QE, S, v, tt), tt), I0, 1e-9, '③定义式 = 微观式');
}
}

for (i = 0; i < vs.length; i++) {
var S2 = 1e-6, n2 = 8.49e28;
chkRel(driftSpeed(Imic(n2, QE, S2, vs[i]), n2, QE, S2), vs[i], 1e-9, '④v = I/(nqS) 反解');
}

var n3 = 8.49e28, S3 = 1e-6, v3 = 7.35e-5, q3 = QE;
var base = Imic(n3, q3, S3, v3);
chkRel(Imic(2 * n3, q3, S3, v3), 2 * base, 1e-12, '⑤∝n');
chkRel(Imic(n3, 2 * q3, S3, v3), 2 * base, 1e-12, '⑤∝q');
chkRel(Imic(n3, q3, 2 * S3, v3), 2 * base, 1e-12, '⑤∝S');
chkRel(Imic(n3, q3, S3, 2 * v3), 2 * base, 1e-12, '⑤∝v');

var tv = 2.5;
chkEq(barrelLen(v3, tv), v3 * tv, 0, '⑥l = vt');
chkEq(barrelVol(S3, v3, tv), S3 * v3 * tv, 0, '⑥V = Sl');
chkRel(barrelCount(n3, S3, v3, tv), n3 * S3 * v3 * tv, 1e-12, '⑥N = nSvt');
chkRel(barrelCharge(n3, q3, S3, v3, tv), barrelCount(n3, S3, v3, tv) * q3, 1e-12, '⑥Q = Nq');

var ds = [1e-5, 5e-5, 2e-4], tds = [0.5, 4, 20];
for (i = 0; i < ds.length; i++) {
for (j = 0; j < tds.length; j++) {
var Qc = barrelCharge(n3, q3, S3, v3, tds[j]);
var Qd = slabQ(n3, q3, S3, v3, tds[j], ds[i]);
var one = slabCharge(n3, q3, S3, ds[i]);
chk(Math.abs(Qd - Qc) <= one * (1 + 1e-9), '⑦离散与连续差 ≤ 一层 (d=' + ds[i] + ', t=' + tds[j] + ')');
chk(Math.abs(Qd - Qc) <= Math.max(one, Qc * 1e-9), '⑦差值受层厚与浮点双重约束');
chkRel(slabCross(v3, tds[j], ds[i]) * 1.0, Math.floor(v3 * tds[j] / ds[i] + 1e-9) * 1.0, 0, '⑦整层数一致');
}
}
chk(slabCross(v3, 0, 1e-5) === 0, '⑦t=0 → 过截面层数 0');
chk(slabQ(n3, q3, S3, v3, 0, 1e-5) === 0, '⑦t=0 → 离散电荷量 0');

chkEq(Imic(n3, q3, S3, 0), 0, 0, '⑧v=0 → I=0');
chkEq(Imic(0, q3, S3, v3), 0, 0, '⑧n=0 → I=0');
chkEq(Imic(n3, 0, S3, v3), 0, 0, '⑧q=0 → I=0');
chkEq(Imic(n3, q3, 0, v3), 0, 0, '⑧S=0 → I=0');
chk(isNaN(Idef(5, 0)), '⑧t=0 → 定义式不给数（NaN，而不是 Infinity）');

var S4 = mm2(1), nCu = numberDensity('cu');
var vCu = driftSpeed(1, nCu, QE, S4);
chkRel(vCu, 7.35e-5, 0.05, '⑨铜 I=1A S=1mm² → v≈7.35×10⁻⁵ m/s');

function onMove(ev) {
if (!drag) { return; }
var p = evPos(ev), dx = p.x - drag.x, dy = p.y - drag.y;
drag.x = p.x; drag.y = p.y;
st.view.az = clamp(st.view.az - dx * 0.006, -0.55, 0.55);
st.view.el = clamp(st.view.el + dy * 0.005, -0.28, 0.62);
draw();
ev.preventDefault();
}
function onUp() { if (drag) { drag = null; cv.style.cursor = 'default'; } }
cv.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
cv.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
cv.addEventListener('touchstart', onDown, { passive: false });
cv.addEventListener('touchmove', onMove, { passive: false });
window.addEventListener('touchend', onUp);
cv.addEventListener('wheel', function (ev) {
ev.preventDefault();
st.view.zoom = clamp(st.view.zoom * Math.exp(-ev.deltaY * 0.0012), 0.55, 2.4);
draw();
}, { passive: false });
cv.addEventListener('dblclick', function () { setupView(St.STEPS[st.step].mode || '3d'); draw(); });

var rzT = null;
window.addEventListener('resize', function () { clearTimeout(rzT); rzT = setTimeout(draw, 120); });

var tocEl = $('toc'), tocLinks = [], tocMarked = -1;
(function buildToc() {
if (!tocEl) { return; }
var curAct = null;
for (var i = 0; i < St.STEPS.length; i++) {
var def = St.STEPS[i];
if (def.act !== curAct) {
if (curAct !== null) { var sp = document.createElement('span'); sp.className = 'sep'; tocEl.appendChild(sp); }
curAct = def.act;
var lab = document.createElement('span');
lab.className = 'grouplab';
lab.textContent = String(def.act).split('·')[0].trim();
lab.title = def.act;
tocEl.appendChild(lab);
}
var a = document.createElement('a');
a.title = (i + 1) + '. ' + def.title;
a.textContent = String(i + 1);
(function (idx, node) { node.addEventListener('click', function () { go(idx); }); })(i, a);
tocEl.appendChild(a);
tocLinks.push(a);
}
})();
function markToc() {
if (!tocLinks.length || tocMarked === st.step) { return; }
tocMarked = st.step;
for (var i = 0; i < tocLinks.length; i++) {
var on = (i === st.step);
tocLinks[i].className = on ? 'on' : '';
if (on && tocLinks[i].scrollIntoView) { tocLinks[i].scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
}
}

function hash() {
var f = R.fitCanvas(cv);
var W = Math.floor(f.W), H = Math.floor(f.H);
var d = f.ctx.getImageData(0, 0, W, H).data;
var h = 2166136261 >>> 0;
for (var i = 0; i < d.length; i += 61) { h ^= d[i]; h = (h * 16777619) >>> 0; }
return ('00000000' + h.toString(16)).slice(-8);
}

function verifyI() {
var cases = 0, maxErr = 0, bad = [];
function chkRel(a, b, tol, tag) {
cases++;
var m = Math.max(Math.abs(a), Math.abs(b)), e = m > 0 ? Math.abs(a - b) / m : 0;
if (e > maxErr) { maxErr = e; }
if (!(e <= tol)) { bad.push(tag + ' rel=' + e.toExponential(2)); }
}
function chk(cond, tag) { cases++; if (!cond) { bad.push(tag); } }
var mats = ['cu', 'ag', 'al'], i, j, k;
var Ss = [0.2e-6, 1e-6, 2e-6], vs = [1e-5, 7.35e-5, 2e-4], ts = [0.5, 8, 20];

for (i = 0; i < mats.length; i++) {
var n = P.numberDensity(mats[i]);
for (j = 0; j < vs.length; j++) {
for (k = 0; k < Ss.length; k++) {
var S = Ss[k], v = vs[j];
var Im = P.Imic(n, P.QE, S, v);
for (var m2 = 0; m2 < ts.length; m2++) {
var Q = P.barrelCharge(n, P.QE, S, v, ts[m2]);
chkRel(Q / ts[m2], Im, 1e-9, '①Q/t = nqSv');
chkRel(P.barrelCount(n, S, v, ts[m2]) / ts[m2] * P.QE, Im, 1e-9, '①Nq/t = nqSv');
}
chkRel(P.driftSpeed(Im, n, P.QE, S), v, 1e-9, '①v = I/(nqS)');
}
}
}

var ref = { cu: 7.351e-5, ag: 1.0656e-4, al: 1.0355e-4 };
for (i = 0; i < mats.length; i++) {
var n2 = P.numberDensity(mats[i]), vv = P.driftSpeed(1, n2, P.QE, 1e-6);
chkRel(vv, ref[mats[i]], 0.06, '②教材数值 v(' + mats[i] + ')');
chk(vv > 0 && vv < 1e-3, '②v 落在 mm/s 以下');
}

for (i = 0; i < ts.length; i++) {
var nc = P.numberDensity('cu'), Sc = 1e-6, vc = 7.35e-5;
var Qc = P.barrelCharge(nc, P.QE, Sc, vc, ts[i]);
var d = P.WIRE_L / 42;
var Qd = P.slabQ(nc, P.QE, Sc, vc, ts[i], d);
chk(Math.abs(Qd - Qc) <= P.slabCharge(nc, P.QE, Sc, d) * (1 + 1e-9), '③离散 ≤ 一层 (t=' + ts[i] + ')');
}

chkRel(P.hour(P.travelTime(1, P.driftSpeed(1, P.numberDensity('cu'), P.QE, 1e-6))), 3.78, 0.06, '④电子爬 1 m ≈ 3.78 h');
chkRel(P.travelTime(1, 2.998e8), 3.34e-9, 0.05, '④电场过 1 m ≈ 3.3 ns');
chk(P.travelTime(1, P.driftSpeed(1, P.numberDensity('cu'), P.QE, 1e-6)) / P.travelTime(1, 2.998e8) > 1e12,
'④两个速度差 10¹² 倍以上');

var N = 6000, mn = 1e9, mx = -1e9;
for (i = 0; i <= N; i++) { var wv = P.waveI(i * 6 / N); mn = Math.min(mn, wv); mx = Math.max(mx, wv); }
var avg = P.waveAvg(6, N);
chk(avg >= mn - 1e-9 && avg <= mx + 1e-9, '⑤平均电流在波形上下界之间');
chkRel(P.waveQ(6, N), P.waveQ(6, 600), 1e-6, '⑤积分收敛');
return { ok: bad.length === 0, cases: cases, maxErr: maxErr, failed: bad.slice(0, 5) };
}

var CONTROL_WORDS = [
['「时间 t」', 't'], ['「电流 I」', 'I'], ['「定向速率 v」', 'v'], ['「速率 v」', 'v'],
['「时间窗口 T」', 'T'], ['「▶ 播放」', 'play'],
['「数密度 n」', 'n'], ['「电荷密度 n」', 'reveal'],
['「横截面积 S」', 'S'], ['「截面 S」', 'S'],
['「铜 / 银 / 铝」', 'mat'], ['「铜」', 'mat'], ['「银」', 'mat'], ['「铝」', 'mat'],
['「负电荷 / 正电荷」', 'carrier'], ['「自由电子」', 'carrier'], ['「正电荷」', 'carrier'],
['「看定义式的 Q」', 'qPick'], ['「看微观式的 q」', 'qPick']
];
var ALLOW_KEYS = { t: 1, I: 1, v: 1, n: 1, S: 1, mat: 1, carrier: 1, qPick: 1, T: 1, play: 1, reveal: 1 };
var SCENES = { wire: 1, duel: 1, twoq: 1, misuse: 1, dim: 1, real: 1, timeline: 1, average: 1, summary: 1 };
function verifySteps() {
var cases = 0, bad = [];
function chk(cond, tag) { cases++; if (!cond) { bad.push(tag); } }
for (var i = 0; i < St.STEPS.length; i++) {
var d = St.STEPS[i], a = Object.keys(d.allow || {}), k;
chk(!!d.title, (i + 1) + ' 有标题');
chk(!!d.formula, (i + 1) + ' 有公式');
chk(!!d.note, (i + 1) + ' 有说明');
chk(!!SCENES[d.scene || 'wire'], (i + 1) + ' 场景名合法');
for (k = 0; k < a.length; k++) { chk(!!ALLOW_KEYS[a[k]], (i + 1) + ' allow 键合法：' + a[k]); }
var hint = d.hint || '';
for (k = 0; k < CONTROL_WORDS.length; k++) {
if (hint.indexOf(CONTROL_WORDS[k][0]) >= 0) {
var need = CONTROL_WORDS[k][1];
if (hint.indexOf('不用拖') >= 0) { continue; }
chk(!!d.allow && d.allow[need] === true, (i + 1) + ' hint 提到「' + CONTROL_WORDS[k][0] + '」→ allow.' + need);
}
}
if (a.length === 0) { chk(hint.indexOf('不用拖') >= 0, (i + 1) + ' 无交互时 hint 必须写明不用拖'); }
chk((d.rng && d.rng.t ? d.rng.t[0] < d.rng.t[1] : true), (i + 1) + ' 滑块范围合法');
chk(d.act !== '', (i + 1) + ' 有幕名');
}
chk(St.STEPS.length >= 12, '步骤数不少于 12');
return { ok: bad.length === 0, cases: cases, failed: bad };
}

window.__viz = {
state: st, steps: St, phys: P, render: R,
count: St.STEPS.length,
go: go, next: next, prev: prev, reset: resetStep, draw: draw, hash: hash,
selfTest: function () { return P.runSelfTest(); },
verifyI: verifyI, verifySteps: verifySteps,
set: function (patch) {
for (var k in patch) { if (Object.prototype.hasOwnProperty.call(patch, k)) { st[k] = patch[k]; } }
if (patch.I !== undefined) { St.syncI(st); }
if (patch.v !== undefined) { St.syncV(st); }
if (patch.n !== undefined || patch.S !== undefined) {
if (st.holdV && patch.v === undefined) { St.syncV(st); } else if (patch.I === undefined) { St.syncI(st); }
}
draw();
return { t: st.t, I: st.I, v: st.v, n: st.n, S: st.S };
},
stepMeta: function () {
return St.STEPS.map(function (d, i) {
return { i: i, act: d.act, title: d.title, allow: Object.keys(d.allow || {}), hint: d.hint || '', scene: d.scene || 'wire' };
});
}
};

St.apply(st, 0);
draw();
setTimeout(draw, 60);
})();

</script>
</body>
